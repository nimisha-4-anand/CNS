<!DOCTYPE html>
<html>
<head>
    <title>Campus Nav - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="background-image"></div>


    <div class="register-box">

        <img
            src="images/logo.png"
            class="login-logo"
        >


        <h1>Create Account</h1>

        <p class="subtitle">
            Join Campus Navigation
        </p>


        <label>Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
        >


        <label>Student ID / Roll No.</label>

        <input
            type="text"
            id="studentId"
            placeholder="Enter your student ID"
        >


        <label>Email</label>

        <input
            type="email"
            id="regEmail"
            placeholder="Enter your email"
        >


        <label>Password</label>

        <div class="password-box">

            <input
                type="password"
                id="regPassword"
                placeholder="Create a password"
                oninput="checkStrength()"
            >

            <button
                type="button"
                class="show-btn"
                onclick="showPassword('regPassword', this)">
                👁
            </button>

        </div>


        <div id="strength">
            Password strength: —
        </div>


        <label>Confirm Password</label>

        <div class="password-box">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
            >

            <button
                type="button"
                class="show-btn"
                onclick="showPassword('confirmPassword', this)">
                👁
            </button>

        </div>


        <label class="terms">

            <input
                type="checkbox"
                id="terms"
            >

            I agree to the Terms & Conditions

        </label>


        <button
            class="main-btn"
            onclick="register()">

            CREATE ACCOUNT →

        </button>


        <p id="regError"></p>


        <p class="bottom-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>


    <script src="script.js"></script>

</body>
</html>
