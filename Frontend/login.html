<!DOCTYPE html>
<html>
<head>
    <title>Campus Nav - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="background-image"></div>

    <div class="login-box">

        <img src="images/logo.png" class="login-logo">

        <h1>Campus Navigation</h1>

        <p class="subtitle">Welcome back!</p>


        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >


        <label>Password</label>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <button
                type="button"
                class="show-btn"
                onclick="showPassword('password', this)">
                👁
            </button>

        </div>


        <div class="login-options">

            <label class="remember">

                <input
                    type="checkbox"
                    id="remember"
                >

                Remember me

            </label>

            <a href="#" onclick="forgotPassword()">
                Forgot Password?
            </a>

        </div>


        <button
            class="main-btn"
            onclick="login()">

            LOGIN →

        </button>


        <p id="error"></p>


        <p class="bottom-text">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </div>


    <script src="script.js"></script>

</body>
</html>
